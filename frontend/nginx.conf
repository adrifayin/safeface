# Static file server for the built SPA (runs non-root on 8080, behind the edge nginx).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server_tokens off;
    access_log off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }
        location / { try_files $uri /index.html; add_header Cache-Control "no-store"; }
    }
}
