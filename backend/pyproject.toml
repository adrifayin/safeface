[project]
name = "safeface-backend"
version = "0.1.0"
description = "SafeFace Forensic Workbench API and analysis workers"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["app/db/migrations/versions", "app/modules/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF", "N"]
ignore = ["S101", "S603", "S607", "B008", "N818", "N812", "RUF001", "RUF002", "RUF003", "UP040"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["app/db/migrations/", "app/modules/_vendor/", "tests/"]

[[tool.mypy.overrides]]
module = ["app.modules._vendor.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.api.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "ml: needs PyTorch (worker image)",
  "tools: needs ExifTool / c2patool binaries",
]
