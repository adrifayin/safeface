# SafeFace Forensic Workbench — single-server stack.
#
# Network isolation:
#   * "backend" is an internal network (internal: true): containers on it have
#     NO route to the outside world. Every service except nginx lives only here.
#   * "edge" carries only nginx, so the browser can reach port 8443. IP
#     masquerading is disabled on it, so nginx cannot open outbound
#     connections to the internet either. See docs/SECURITY.md for the host
#     egress firewall rule that backs this up.
#
# Secrets come from infra/.env (generate with: python scripts/init_secrets.py).

name: safeface

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

x-backend-env: &backend-env
  SAFEFACE_ENV: ${SAFEFACE_ENV:-dev}
  SAFEFACE_DATABASE_URL: postgresql+psycopg://safeface_app:${SAFEFACE_APP_PASSWORD}@postgres:5432/safeface
  SAFEFACE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  SAFEFACE_S3_ENDPOINT: http://minio:9000
  SAFEFACE_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  SAFEFACE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  SAFEFACE_OBJECT_LOCK_MODE: ${OBJECT_LOCK_MODE:-COMPLIANCE}
  SAFEFACE_OBJECT_LOCK_DAYS: ${OBJECT_LOCK_DAYS:-1}
  SAFEFACE_OIDC_ISSUER: https://${PUBLIC_HOST:-localhost}:${PUBLIC_PORT:-8443}/auth/realms/safeface
  SAFEFACE_OIDC_JWKS_URL: http://keycloak:8080/auth/realms/safeface/protocol/openid-connect/certs
  SAFEFACE_MODELS_DIR: /models
  SAFEFACE_WORK_DIR: /work
  SAFEFACE_IMAGE_DIGEST: ${SAFEFACE_IMAGE_DIGEST:-unknown (dev build)}
  SAFEFACE_DEPLOYMENT_NAME: ${SAFEFACE_DEPLOYMENT_NAME:-SafeFace dev deployment}

networks:
  backend:
    internal: true
  edge:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  pgdata: {}
  miniodata: {}
  redisdata: {}

services:
  postgres:
    image: postgres:16.6-bookworm
    <<: *hardening
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SAFEFACE_OWNER_PASSWORD: ${SAFEFACE_OWNER_PASSWORD}
      SAFEFACE_APP_PASSWORD: ${SAFEFACE_APP_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      # Production: place this volume on an encrypted filesystem (docs/SECURITY.md).
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs: ["/var/run/postgresql", "/tmp"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safeface"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4.1-alpine
    <<: *hardening
    user: "999:1000"   # the image's redis user; avoids needing SETUID to drop privileges
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    # Built from pinned upstream source (infra/minio/Dockerfile): MinIO no longer
    # publishes community images to public registries.
    build: {context: ./minio}
    image: safeface/minio:RELEASE.2024-12-18T13-15-44Z
    <<: *hardening
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Static KMS key enables SSE-S3 (AES-256). Production: MinIO KES + HSM/KMS.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
      MINIO_BROWSER: "off"
      MINIO_UPDATE: "off"
      MINIO_CALLHOME_ENABLE: "off"
    volumes: [miniodata:/data]
    tmpfs: ["/tmp"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${PUBLIC_HOST:-localhost}:${PUBLIC_PORT:-8443}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}

  migrate:
    # One-shot job: schema migrations (as the owner role) and bucket bootstrap.
    build: {context: ../backend, target: api}
    image: safeface/api:dev
    <<: *hardening
    restart: "no"
    command: ["python", "-m", "app.bootstrap"]
    environment:
      <<: *backend-env
      SAFEFACE_DATABASE_OWNER_URL: postgresql+psycopg://safeface_owner:${SAFEFACE_OWNER_PASSWORD}@postgres:5432/safeface
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}

  api:
    image: safeface/api:dev
    <<: *hardening
    environment: *backend-env
    volumes: ["../models:/models:ro"]
    tmpfs: ["/tmp"]
    networks: [backend]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      retries: 12

  worker-cpu:
    build: {context: ../backend, target: worker}
    image: safeface/worker:dev
    <<: *hardening
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO",
              "--concurrency=2", "-Q", "cpu", "-n", "cpu@%h"]
    environment: *backend-env
    volumes: ["../models:/models:ro"]
    tmpfs: ["/tmp:size=512m", "/work:size=8g,uid=10001,gid=10001,mode=0700"]
    networks: [backend]
    mem_limit: 6g
    cpus: 4
    pids_limit: 256
    ulimits: {nofile: {soft: 4096, hard: 4096}}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker-gpu:
    # Consumes the "gpu" queue. Without the GPU override file it runs on CPU,
    # so the stack works on machines without NVIDIA hardware. To use the GPU:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
    image: safeface/worker:dev
    <<: *hardening
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO",
              "--concurrency=1", "-Q", "gpu", "-n", "gpu@%h"]
    environment: *backend-env
    volumes: ["../models:/models:ro"]
    tmpfs: ["/tmp:size=1g", "/work:size=8g,uid=10001,gid=10001,mode=0700"]
    networks: [backend]
    mem_limit: 8g
    cpus: 4
    pids_limit: 256
    shm_size: 1g
    depends_on:
      worker-cpu: {condition: service_started}

  frontend:
    build: {context: ../frontend}
    image: safeface/frontend:dev
    <<: *hardening
    tmpfs: ["/tmp"]
    networks: [backend]

  nginx:
    image: nginxinc/nginx-unprivileged:1.27.3-alpine
    <<: *hardening
    ports: ["${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_PORT:-8443}:8443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/out:/etc/nginx/certs:ro
    tmpfs: ["/tmp"]
    networks: [backend, edge]
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_started}
      keycloak: {condition: service_started}
