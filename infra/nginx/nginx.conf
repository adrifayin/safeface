# Single TLS entry point. TLS 1.3 only, internal CA certificate (infra/certs).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    # Do not log query strings (they can carry identifiers); paths only.
    log_format safeface '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout safeface;

    upstream api       { server api:8000; }
    upstream keycloak  { server keycloak:8080; }
    upstream frontend  { server frontend:8080; }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.3;
        ssl_session_tickets off;
        ssl_session_cache shared:TLS:10m;

        # Evidence uploads: up to 4 GiB, streamed straight to the API (no disk buffering here).
        client_max_body_size 4100m;
        proxy_request_buffering off;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;

        location /api/ {
            proxy_pass http://api;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control "no-store" always;
        }

        location /auth/ {
            proxy_pass http://keycloak;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Referrer-Policy no-referrer always;
        }

        location / {
            proxy_pass http://frontend;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            # Nothing may be loaded from or sent to any other origin.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;
        }
    }
}
