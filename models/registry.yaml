# SafeFace model registry. Weights are NEVER downloaded at runtime.
#
# A file is used only if it is listed here WITH a sha256 and the file on disk
# matches it (checked on every load). sha256: null means "not yet verified by
# an administrator" and the file is refused.
#
# Install procedure and provenance of each hash: scripts/fetch_models.md.
# Changing this file is a controlled change: record it in the change log and
# re-sync (the API audits every registry change it observes on start-up).
#
# validation: filled from the Phase 4 benchmark runner. Until then each entry
# says so explicitly; the UI and reports print this summary.

